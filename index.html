  const db = getFirestore(app);

  window.fbSetRoom = (code, data) => setDoc(doc(db, "rooms", code), data);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ======================== sound ======================== */
const sound = (() => {
  let actx = null;
  function audioCtx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  // iOS Safari only unlocks Web Audio inside the call stack of a direct user
  // gesture. Grab the very first tap anywhere on the page (capture phase, before
  // any button's own handler runs) and unlock the AudioContext right then.
  const unlock = () => { try { audioCtx(); } catch (e) {} };
  document.addEventListener("touchstart", unlock, { capture: true, once: true });
  document.addEventListener("pointerdown", unlock, { capture: true, once: true });
  // Boosts every effect uniformly (capped well below 1.0 so overlapping tones
  // don't clip) — bumped up after feedback that sounds were too quiet on phones.
  const GAIN_BOOST = 1.8;
  const GAIN_CAP = 0.9;

  function playTone(freq, start, dur, type = "sine", gainPeak = 0.25) {
    const ctx = audioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
    const peak = Math.min(gainPeak * GAIN_BOOST, GAIN_CAP);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(peak, ctx.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.05);
  }
  let musicHandle = null;
  return {
    playTension() {
      playTone(160, 0, 0.18, "triangle", 0.3);
      playTone(160, 0.22, 0.18, "triangle", 0.3);
      playTone(120, 0.44, 0.28, "triangle", 0.32);
    },
    playTimeUp() {
      playTone(110, 0, 0.35, "sawtooth", 0.28);
      playTone(90, 0.32, 0.5, "sawtooth", 0.3);
    },
    playSuccess() {
      playTone(523, 0, 0.14, "sine", 0.28);
      playTone(659, 0.09, 0.2, "sine", 0.28);
      playTone(784, 0.18, 0.25, "sine", 0.26);
    },
    playSkipSound() {
      playTone(220, 0, 0.1, "square", 0.16);
      playTone(196, 0.09, 0.14, "square", 0.14);
    },
    playRoomCreated() {
      playTone(392, 0, 0.16, "sine", 0.22);
      playTone(494, 0.1, 0.16, "sine", 0.22);
      playTone(587, 0.2, 0.22, "sine", 0.24);
      playTone(784, 0.32, 0.3, "sine", 0.2);
    },
    playJoined() {
      playTone(660, 0, 0.14, "sine", 0.22);
      playTone(880, 0.08, 0.22, "sine", 0.22);
    },
    playGameStart() {
      playTone(392, 0, 0.14, "sine", 0.24);
      playTone(523, 0.1, 0.14, "sine", 0.24);
      playTone(659, 0.2, 0.14, "sine", 0.24);
      playTone(784, 0.3, 0.16, "sine", 0.26);
      playTone(1046, 0.44, 0.35, "sine", 0.24);
    },
    startLobbyMusic() {
      if (musicHandle) return;
      const notes = [261.6, 293.7, 329.6, 392.0, 440.0];
      let i = 0;
      musicHandle = setInterval(() => {
        playTone(notes[i % notes.length], 0, 1.6, "sine", 0.05);
        playTone(notes[i % notes.length] / 2, 0, 1.8, "sine", 0.035);
        i++;
      }, 2200);
    },
    stopLobbyMusic() {
      if (musicHandle) { clearInterval(musicHandle); musicHandle = null; }
    },
  };
})();

/* ======================== room sync (Firebase + local fallback) ======================== */
function roomKey(code) { return "atias_room_" + code; }

function broadcastLocal(room) {
  const bc = new BroadcastChannel("atias_" + room.code);
  bc.postMessage(room);
  bc.close();
}

function saveRoom(room) {
  room.updatedAt = Date.now();
  localStorage.setItem(roomKey(room.code), JSON.stringify(room));
  broadcastLocal(room);
  if (window.fbSetRoom) {
    window.fbSetRoom(room.code, room).catch((err) => console.error("fbSetRoom failed", err));
  }
  return room;
}

async function loadRoom(code) {
  if (window.fbGetRoom) {
    try {
      const remote = await window.fbGetRoom(code);
      if (remote) return remote;
    } catch (err) { console.error("fbGetRoom failed", err); }
  }
  const raw = localStorage.getItem(roomKey(code));
  return raw ? JSON.parse(raw) : null;
}

function connectRoom(code, onUpdate) {
  const bc = new BroadcastChannel("atias_" + code);
  bc.onmessage = (e) => onUpdate(e.data);

  const onStorage = (e) => {
    if (e.key === roomKey(code) && e.newValue) onUpdate(JSON.parse(e.newValue));
  };
  window.addEventListener("storage", onStorage);

  let fbUnsub = null;
  const attach = () => { fbUnsub = window.fbWatchRoom(code, (data) => { if (data) onUpdate(data); }); };
  if (window.fbWatchRoom) attach();
  else {
    let tries = 0;
    const wait = setInterval(() => {
      tries++;
      if (window.fbWatchRoom) { clearInterval(wait); attach(); }
      else if (tries > 40) clearInterval(wait);
    }, 100);
  }

  return () => {
    bc.close();
    window.removeEventListener("storage", onStorage);
    if (fbUnsub) fbUnsub();
  };
}

  const roomRef = useRef(null);
  const usedWordsRef = useRef([]);
  const statsRef = useRef({ correct: 0, skip: 0 });
  const timerIntervalRef = useRef(null);
  const unsubscribeRef = useRef(null);
  const prevTeamsLenRef = useRef(null);
  const prevPhaseRef = useRef(null);
  const musicOnRef = useRef(false);
  const finishTurnRef = useRef(() => {});

  useEffect(() => { roomRef.current = room; }, [room]);

  useEffect(() => {
    let dev = localStorage.getItem("atias_device_id");
    if (!dev) { dev = uid(); localStorage.setItem("atias_device_id", dev); }
    setDeviceId(dev);
  }, []);

  useEffect(() => {
    return () => {
      if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
      if (unsubscribeRef.current) unsubscribeRef.current();
      sound.stopLobbyMusic();
    };
  }, []);

  useEffect(() => {
    if (room && prevTeamsLenRef.current != null && room.teams.length > prevTeamsLenRef.current) {
      sound.playJoined();
    }
    prevTeamsLenRef.current = room ? room.teams.length : null;

    const isLobbyPhase = !!(room && room.phase === "lobby" && view === "lobby");
    if (isLobbyPhase && !musicOnRef.current) { sound.startLobbyMusic(); musicOnRef.current = true; }
    else if (!isLobbyPhase && musicOnRef.current) { sound.stopLobbyMusic(); musicOnRef.current = false; }
  }, [room, view]);

  useEffect(() => {
    if (room && room.phase !== "lobby" && view === "lobby") setView("playing");
  }, [room, view]);

  // Fanfare for every connected device the moment the game actually begins
  // (lobby -> picking), not for devices that join an already-started game.
  useEffect(() => {
    const phase = room ? room.phase : null;
    if (prevPhaseRef.current === "lobby" && phase && phase !== "lobby") sound.playGameStart();
    prevPhaseRef.current = phase;
  }, [room]);

  const persistRoom = useCallback((nextRoom) => {
    setRoom(nextRoom);
    saveRoom(nextRoom);
  }, []);

  const attachRoom = useCallback((code) => {
    if (unsubscribeRef.current) unsubscribeRef.current();
    unsubscribeRef.current = connectRoom(code, (incoming) => setRoom(incoming));
  }, []);

  const goHome = useCallback(() => { setView("home"); setJoinError(false); }, []);

  const goCreate = useCallback(() => {
    const code = genCode();
    attachRoom(code);
    const newRoom = {
      code, teams: [], currentTeamIdx: 0, phase: "lobby", activeNumber: null, turnResult: null,
      turnSeconds: turnSecondsDraft, boardLength: BOARD_LENGTH_DEFAULT, hostDeviceId: deviceId,
    };
    sound.playRoomCreated();
    setView("lobby");
    setRoomCode(code);
    persistRoom(newRoom);
  }, [attachRoom, persistRoom, turnSecondsDraft, deviceId]);

  const goJoin = useCallback(() => { setView("join"); setJoinCodeInputState(""); setJoinError(false); }, []);

  const setJoinCode = useCallback((value) => setJoinCodeInputState(value.toUpperCase().slice(0, 4)), []);

  const findRoom = useCallback(async () => {
    const code = joinCodeInput.trim().toUpperCase();
    const found = await loadRoom(code);
    if (!found) { setJoinError(true); return; }
    attachRoom(code);
    setRoomCode(code);
    setRoom(found);
    setJoinError(false);
    setView(found.phase === "lobby" ? "setup" : "playing");
    setIsSpectator(found.phase !== "lobby");
  }, [joinCodeInput, attachRoom]);

  const setTurnSeconds = useCallback((sec) => {
    setTurnSecondsDraft(sec);
    if (roomRef.current) persistRoom({ ...roomRef.current, turnSeconds: sec });
  }, [persistRoom]);

  const moveTeamOrder = useCallback((teamId, dir) => {
    const current = roomRef.current;
    if (!current) return;
    const idx = current.teams.findIndex((t) => t.id === teamId);
    const j = idx + dir;
    if (idx < 0 || j < 0 || j >= current.teams.length) return;
    const teams = current.teams.slice();
    [teams[idx], teams[j]] = [teams[j], teams[idx]];
    persistRoom({ ...current, teams: teams.map((t, i) => ({ ...t, order: i + 1 })) });
  }, [persistRoom]);

  const setSetupName = useCallback((value) => setSetupNameState(value), []);

  const confirmSetup = useCallback(() => {
    const name = setupName.trim();
    if (!name) return;
    const current = roomRef.current;
    if (!current || current.teams.length >= MAX_TEAMS) return;
    const order = current.teams.length + 1;
    const team = { id: uid(), order, name, color: TEAM_COLORS[(order - 1) % MAX_TEAMS], position: 0, claimedBy: deviceId };
    sound.playJoined();
    localStorage.setItem("atias_myteam_" + current.code, team.id);
    setMyTeamId(team.id);
    setView("lobby");
    persistRoom({ ...current, teams: [...current.teams, team] });
  }, [setupName, deviceId, persistRoom]);

  const hostStartGame = useCallback(() => {
    const current = roomRef.current;
    if (!current || current.teams.length < 2) return;
    persistRoom({ ...current, phase: "picking", currentTeamIdx: 0 });
  }, [persistRoom]);

  const drawCard = useCallback((activeNumber) => {
    const used = usedWordsRef.current;
    let available = WORD_BANK.filter((w) => !used.includes(w));
    let nextUsed = used;
    if (available.length < 8) { nextUsed = []; available = WORD_BANK; }
    const picks = shuffle(available).slice(0, 8);
    usedWordsRef.current = [...nextUsed, picks[(activeNumber || 1) - 1]];
    setCardWords(picks);
  }, []);

  const startTurnTimer = useCallback((turnSecondsForRoom) => {
    if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
    const dur = turnSecondsForRoom || TURN_SECONDS;
    const halfway = Math.floor(dur / 2);
    let t = dur;
    statsRef.current = { correct: 0, skip: 0 };
    usedWordsRef.current = [];
    setTimeLeft(dur);
    setCorrectCount(0);
    setSkipCount(0);
    timerIntervalRef.current = setInterval(() => {
      t -= 1;
      if (t <= 0) {
        clearInterval(timerIntervalRef.current);
        timerIntervalRef.current = null;
        sound.playTimeUp();
        finishTurnRef.current();
      } else {
        setTimeLeft(t);
        if (t === halfway) sound.playTension();
        if (t % 3 === 0 && roomRef.current) persistRoom({ ...roomRef.current, timeLeft: t });
      }
    }, 1000);
  }, [persistRoom]);

  const pickNumber = useCallback((num) => {
    const current = roomRef.current;
    if (!current) return;
    const nextRoom = { ...current, activeNumber: num, phase: "playing", turnStartedAt: Date.now() };
    persistRoom(nextRoom);
    startTurnTimer(nextRoom.turnSeconds);
    drawCard(num);
    setFlipDeg((deg) => deg + 360);
  }, [persistRoom, startTurnTimer, drawCard]);

  const pickRedRound = useCallback(() => {
    const current = roomRef.current;
    if (!current) return;
    persistRoom({ ...current, phase: "redround", redWord: shuffle(WORD_BANK)[0], redWordsUsed: 0, redMax: RED_ROUND_MAX });
  }, [persistRoom]);

  // The board already knows exactly which cell a team's token sits on, so
  // starting a turn no longer needs to ask "which number are you on" — it
  // reads the number (or red-round) straight off that cell.
  const startTurnFromBoard = useCallback(() => {
    const current = roomRef.current;
    if (!current) return;
    const team = current.teams[current.currentTeamIdx];
    if (!team) return;
    const boardLen = current.boardLength || BOARD_LENGTH_DEFAULT;
    const cellIdx = Math.min(team.position || 0, boardLen - 1);
    if (isRedCell(cellIdx)) pickRedRound();
    else pickNumber((cellIdx % 8) + 1);
  }, [pickRedRound, pickNumber]);

  const awardRedPoint = useCallback((teamId) => {
    const current = roomRef.current;
    if (!current) return;
    const teams = current.teams.map((t) => (t.id === teamId ? { ...t, position: (t.position || 0) + 1 } : t));
    const team = teams.find((t) => t.id === teamId);
    const boardLength = current.boardLength || BOARD_LENGTH_DEFAULT;
    const redWordsUsed = (current.redWordsUsed || 0) + 1;
    sound.playSuccess();
    if (team.position >= boardLength) {
      persistRoom({ ...current, teams, phase: "gameover", winnerTeamId: team.id, redWordsUsed });
      return;
    }
    if (redWordsUsed >= (current.redMax || RED_ROUND_MAX)) {
      persistRoom({
        ...current, teams, redWordsUsed,
        currentTeamIdx: (current.currentTeamIdx + 1) % current.teams.length,
        phase: "picking", activeNumber: null,
      });
    } else {
      persistRoom({ ...current, teams, redWordsUsed, redWord: shuffle(WORD_BANK)[0] });
    }
  }, [persistRoom]);

  const stopRedRound = useCallback(() => {
    const current = roomRef.current;
    if (!current) return;
    persistRoom({
      ...current,
      currentTeamIdx: (current.currentTeamIdx + 1) % current.teams.length,
      phase: "picking", activeNumber: null,
    });
  }, [persistRoom]);

  const flipCard = useCallback((applyResult) => {
    setFlipDeg((deg) => deg + 360);
    setTimeout(() => {
      applyResult();
      drawCard(roomRef.current ? roomRef.current.activeNumber : null);
    }, 420);
  }, [drawCard]);

  const markCorrect = useCallback(() => {
    sound.playSuccess();
    flipCard(() => {
      statsRef.current = { ...statsRef.current, correct: statsRef.current.correct + 1 };
      setCorrectCount(statsRef.current.correct);
    });
  }, [flipCard]);

  const markSkip = useCallback(() => {
    sound.playSkipSound();
    flipCard(() => {
      statsRef.current = { ...statsRef.current, skip: statsRef.current.skip + 1 };
      setSkipCount(statsRef.current.skip);
    });
  }, [flipCard]);

  const finishTurn = useCallback(() => {
    const current = roomRef.current;
    if (!current) return;
    const { correct, skip } = statsRef.current;
    const advance = Math.max(correct - skip, 0);
    const teams = current.teams.map((t, i) => (i === current.currentTeamIdx ? { ...t, position: (t.position || 0) + advance } : t));
    const team = teams[current.currentTeamIdx];
    const boardLength = current.boardLength || BOARD_LENGTH_DEFAULT;
    const turnResult = { advance, correct, skip };
    if (team.position >= boardLength) {
      persistRoom({ ...current, teams, turnResult, phase: "gameover", winnerTeamId: team.id });
    } else {
      persistRoom({ ...current, teams, turnResult, phase: "result" });
    }
  }, [persistRoom]);

  useEffect(() => { finishTurnRef.current = finishTurn; }, [finishTurn]);

  const nextTurn = useCallback(() => {
    const current = roomRef.current;
    if (!current) return;
    persistRoom({
      ...current,
      currentTeamIdx: (current.currentTeamIdx + 1) % current.teams.length,
      phase: "picking", activeNumber: null, turnResult: null,
    });
  }, [persistRoom]);

  return {
    state: {
      view, roomCode, room, deviceId, myTeamId, isSpectator, joinCodeInput, joinError, setupName,
      turnSecondsDraft, timeLeft, cardWords, flipDeg, correctCount, skipCount,
    },
    actions: {
      goHome, goCreate, goJoin, setJoinCode, findRoom, setTurnSeconds, moveTeamOrder, setSetupName,
      confirmSetup, hostStartGame, startTurnFromBoard, awardRedPoint, stopRedRound,
      markCorrect, markSkip, nextTurn,
    },
  };
}

/* ======================== view-model ======================== */
function deriveView(state, actions) {
  const { view, room, myTeamId, isSpectator, deviceId, roomCode, timeLeft, cardWords, flipDeg, setupName, correctCount, skipCount } = state;

  const isHome = view === "home";
  const isJoin = view === "join";
  const isSetup = view === "setup";
  const isHost = !!(room && deviceId && room.hostDeviceId === deviceId);

  const teamsSource = room ? room.teams : [];
  const teams = teamsSource.map((t, idx) => ({
    id: t.id, name: t.name, color: t.color,
    order: t.order || idx + 1,
    position: t.position || 0,
    isMe: t.id === myTeamId,
    isFirst: idx === 0, isLast: idx === teamsSource.length - 1,
    upOpacity: idx === 0 ? 0.3 : 1,
    downOpacity: idx === teamsSource.length - 1 ? 0.3 : 1,
    moveUp: () => actions.moveTeamOrder(t.id, -1),
    moveDown: () => actions.moveTeamOrder(t.id, 1),
  }));

  const isLobbyWaiting = view === "lobby" && !!room && room.phase === "lobby";
  const canStart = !!(room && room.teams.length >= 2);
  const startDisabled = !canStart;
  const startOpacity = canStart ? 1 : 0.5;

  const isGameOver = !!room && room.phase === "gameover";
  const winnerTeam = isGameOver ? room.teams.find((t) => t.id === room.winnerTeamId) : null;

  const isPlayingScreen = view === "playing" && !!room && ["picking", "playing", "result", "redround"].includes(room.phase);
  const activeTeam = (room && room.teams[room.currentTeamIdx]) || { name: "", color: "oklch(0.6 0.1 90)", position: 0 };
  const isMyActiveTeam = !isSpectator && !!myTeamId && activeTeam.id === myTeamId;

  const isMyTurnPicking = isPlayingScreen && isMyActiveTeam && room.phase === "picking";
  const isMyTurnPlaying = isPlayingScreen && isMyActiveTeam && room.phase === "playing";
  const isMyTurnResult = isPlayingScreen && isMyActiveTeam && room.phase === "result";
  const isMyTurnRedRound = isPlayingScreen && isMyActiveTeam && room.phase === "redround";
  const isSpectating = isPlayingScreen && !isMyActiveTeam;
  const isSpectatingCardPhase = isSpectating && !!room && (room.phase === "playing" || room.phase === "redround");

  const redTeamChoices = room && room.phase === "redround"
    ? room.teams.map((t) => ({ id: t.id, name: t.name, color: t.color, award: () => actions.awardRedPoint(t.id) }))
    : [];

  const boardLength = (room && room.boardLength) || BOARD_LENGTH_DEFAULT;
  const myBoardCellIdx = isMyTurnPicking ? Math.min(activeTeam.position || 0, boardLength - 1) : null;
  const myBoardIsRed = myBoardCellIdx != null && isRedCell(myBoardCellIdx);
  const myBoardNumber = myBoardCellIdx != null ? (myBoardCellIdx % 8) + 1 : null;

  const activeNumber = room ? room.activeNumber : null;
  const words = cardWords.length ? cardWords : ["...", "...", "...", "...", "...", "...", "...", "..."];
  const cardWordsUi = words.map((w, i) => {
    const isTarget = i + 1 === activeNumber;
    return {
      text: w,
      bg: isTarget ? "#ece0c2" : "transparent",
      color: isTarget ? "#8a2d1c" : "#6b4a1e",
      starColor: isTarget ? "#c0392b" : "#b08d3f",
      starSize: isTarget ? "20px" : "15px",
      size: isTarget ? "21px" : "16px",
      weight: isTarget ? "700" : "500",
      padding: isTarget ? "10px 12px" : "4px 12px",
    };
  });

  const roomTurnSeconds = (room && room.turnSeconds) || TURN_SECONDS;
  const displayTime = isMyActiveTeam ? timeLeft : room && room.timeLeft != null ? room.timeLeft : roomTurnSeconds;
  const timeLeftLabel = displayTime != null ? fmtTime(displayTime) : fmtTime(roomTurnSeconds);
  const timerColor = displayTime <= 10 ? "oklch(0.7 0.18 25)" : "var(--color-text)";
  const timerAnim = displayTime <= 10 ? "atias-pulse 0.6s ease infinite" : "none";

  const durationChoices = DURATION_OPTIONS.map((sec) => {
    const active = roomTurnSeconds === sec;
    return {
      label: fmtTime(sec),
      pick: () => actions.setTurnSeconds(sec),
      bg: active ? "var(--color-accent)" : "transparent",
      color: active ? "var(--color-bg)" : "var(--color-text)",
      borderColor: active ? "var(--color-accent)" : "var(--color-divider)",
    };
  });

  const spectatorStatus = room && room.phase === "picking" ? "בוחרים מספר..." :
    room && room.phase === "playing" ? "מסבירים כרגע" :
    room && room.phase === "redround" ? "🔴 עיגול אדום — תור משותף, הקשיבו!" : "מסכמים תור";
  const showSpectatorTimer = !!room && room.phase === "playing";

  return {
    isHome, isJoin, isSetup, isLobbyWaiting, isPlayingScreen, isGameOver, roomCode, teams, durationChoices,
    setupName, confirmDisabled: !setupName || !setupName.trim(), isHost, canStart, startDisabled, startOpacity,
    showHostNameInput: isHost && !myTeamId,
    lobbyStatusText: isHost
      ? "שתפו את הקוד עם שאר המכשירים, סדרו את התור והתחילו כשמוכנים"
      : "המספר ליד כל קבוצה הוא סדר התור — רק המארח יכול לשנות אותו",
    winnerTeam, boardLength, joinErrorText: "לא נמצאה קבוצה עם הקוד הזה",
    activeTeam, turnLabel: room ? (activeTeam.position || 0) + "/" + boardLength : "",
    isMyTurnPicking, isMyTurnPlaying, isMyTurnResult, isMyTurnRedRound, isSpectating, isSpectatingCardPhase,
    pickableIdx: myBoardCellIdx, onPick: actions.startTurnFromBoard,
    pickInstructions: myBoardIsRed
      ? "אתם עומדים על משבצת אדומה — לחצו עליה בלוח, זה תור משותף לכולם"
      : `לחצו על המשבצת הלבנה שמהבהבת בלוח — מספר ${myBoardNumber}`,
    redTeamChoices,
    redWord: room ? room.redWord : "",
    redWordIndex: room ? (room.redWordsUsed || 0) + 1 : 1,
    redMax: room ? room.redMax || 5 : 5,
    activeNumber, cardWords: cardWordsUi, flipDeg,
    correctCount: correctCount || 0, skipCount: skipCount || 0,
    timeLeftLabel, timerColor, timerAnim,
    advanceCount: room && room.turnResult ? room.turnResult.advance : 0,
    spectatorStatus, showSpectatorTimer,
  };
}

const BOARD_COLS = 26;
const BOARD_ROWS = 12;

function buildPerimeterPath(cols, rows) {
  const path = [];
  for (let c = 0; c < cols; c++) path.push({ row: 0, col: c });
  for (let r = 1; r < rows; r++) path.push({ row: r, col: cols - 1 });
  for (let c = cols - 2; c >= 0; c--) path.push({ row: rows - 1, col: c });
  for (let r = rows - 2; r >= 1; r--) path.push({ row: r, col: 0 });
  return path;
}

// Calibrated against the board photo (1344x797) — corners of the outer ring
// of circles, in % of image width/height.
const BOARD_CORNERS = { tl: [14.51, 21.58], tr: [89.06, 25.09], br: [92.04, 75.03], bl: [8.41, 75.03] };

function boardBilinear(u, v) {
  const c = BOARD_CORNERS;
  const x = (1 - u) * (1 - v) * c.tl[0] + u * (1 - v) * c.tr[0] + u * v * c.br[0] + (1 - u) * v * c.bl[0];
  const y = (1 - u) * (1 - v) * c.tl[1] + u * (1 - v) * c.tr[1] + u * v * c.br[1] + (1 - u) * v * c.bl[1];
  return [x, y];
}

const BOARD_PATH = buildPerimeterPath(BOARD_COLS, BOARD_ROWS).map((cell) => {
  const u = cell.col / (BOARD_COLS - 1);
  const v = cell.row / (BOARD_ROWS - 1);
  const [x, y] = boardBilinear(u, v);
  return { xPct: x, yPct: y };
});

function TeamLegend({ teams, activeTeamId, boardLength }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center" }}>
      {teams.map((t) => (
        <div key={t.id} style={{
          display: "flex", alignItems: "center", gap: 5, fontSize: 12, background: "var(--color-surface)",
          borderRadius: 999, padding: "4px 10px", opacity: t.id === activeTeamId ? 1 : 0.7,
          boxShadow: t.id === activeTeamId ? `0 0 0 1.5px ${t.color}` : "var(--shadow-sm)",
        }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: t.color, flexShrink: 0 }} />
          <span style={{ fontWeight: 500 }}>{t.name}</span>
          <span style={{ color: "color-mix(in srgb, var(--color-text) 55%, transparent)" }}>{t.position || 0}/{boardLength}</span>
        </div>
      ))}
    </div>
  );
}

function BoardPhoto({ teams, activeTeamId, boardLength, pickableIdx, onPick, tokenScale = 1 }) {
  const teamsByCell = {};
  teams.forEach((t) => {
    const idx = Math.min(t.position || 0, BOARD_PATH.length - 1);
    teamsByCell[idx] = teamsByCell[idx] || [];
    teamsByCell[idx].push(t);
  });

  const pickCell = pickableIdx != null ? BOARD_PATH[pickableIdx] : null;
  const isPickRed = pickableIdx != null && isRedCell(pickableIdx);
  const pickLabel = pickableIdx != null ? (pickableIdx % 8) + 1 : null;

  const tokenSize = 22 * tokenScale;
  const markerSize = 40 * tokenScale;

  return (
    <div style={{ width: "100%", position: "relative", aspectRatio: "1344 / 797", borderRadius: 16, overflow: "hidden", boxShadow: "0 10px 30px rgba(0,0,0,0.5)" }}>
      <img src={BOARD_IMG} alt="הלוח" style={{ width: "100%", height: "100%", display: "block", objectFit: "cover" }} draggable={false} />

      {Object.entries(teamsByCell).map(([idx, cellTeams]) =>
        cellTeams.map((t, ti) => {
          const cell = BOARD_PATH[Number(idx)];
          const dxPct = (ti - (cellTeams.length - 1) / 2) * 1.6 * tokenScale;
          const isActive = t.id === activeTeamId;
          return (
            <div key={t.id} style={{
              position: "absolute", left: `${cell.xPct + dxPct}%`, top: `${cell.yPct}%`,
              width: tokenSize, height: tokenSize, marginLeft: -tokenSize / 2, marginTop: -tokenSize / 2,
              borderRadius: "50%", background: t.color, border: `${1.5 * tokenScale}px solid white`,
              boxShadow: isActive ? `0 0 0 ${3 * tokenScale}px ${t.color}66, 0 0 ${10 * tokenScale}px ${t.color}` : "0 2px 5px rgba(0,0,0,0.5)",
              transition: "left 0.6s cubic-bezier(0.4, 0.1, 0.2, 1), top 0.6s cubic-bezier(0.4, 0.1, 0.2, 1)",
              zIndex: isActive ? 5 : 2,
            }} />
          );
        })
      )}

      {pickCell && (
        <div onClick={onPick} style={{
          position: "absolute", left: `${pickCell.xPct}%`, top: `${pickCell.yPct}%`,
          width: markerSize, height: markerSize, marginLeft: -markerSize / 2, marginTop: -markerSize / 2,
          borderRadius: "50%", background: isPickRed ? "#b8322f" : "white",
          border: `${3 * tokenScale}px solid ${isPickRed ? "#7a1f1c" : "var(--color-accent)"}`,
          color: isPickRed ? "white" : "#161826", fontSize: 16 * tokenScale, fontWeight: 800,
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
          animation: "atias-pulse 0.8s ease infinite",
          boxShadow: `0 0 ${14 * tokenScale}px ${3 * tokenScale}px rgba(255,255,255,0.7)`,
          zIndex: 6,
        }}>
          {isPickRed ? "🔴" : pickLabel}
        </div>
      )}
    </div>
  );
}

function BoardModal({ teams, activeTeamId, boardLength, pickableIdx, onPick, onClose }) {
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const [drag, setDrag] = useState(null);

  const onPointerDown = (e) => {
    setDrag({ startX: e.clientX, startY: e.clientY, origX: pos.x, origY: pos.y });
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!drag) return;
    setPos({ x: drag.origX + (e.clientX - drag.startX), y: drag.origY + (e.clientY - drag.startY) });
  };
  const endDrag = () => setDrag(null);

  return ReactDOM.createPortal(
    <div style={{
      position: "fixed", inset: 0, background: "radial-gradient(circle at 50% 30%, rgba(30,20,10,0.97), rgba(6,9,15,0.98))",
      zIndex: 50, display: "flex", flexDirection: "column",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: "16px 16px 6px", position: "relative" }}>
        <div style={{ fontSize: 13, color: "color-mix(in srgb, var(--color-text) 65%, transparent)" }}>גררו כדי לזוז על הלוח</div>
        <button onClick={onClose} style={{
          position: "absolute", insetInlineEnd: 16, top: 10, width: 38, height: 38, borderRadius: "50%",
          border: "1px solid var(--color-divider)", background: "var(--color-surface)", color: "var(--color-text)", fontSize: 17, cursor: "pointer",
        }}>✕</button>
      </div>

      <div
        style={{ position: "relative", flex: 1, overflow: "hidden", touchAction: "none", cursor: drag ? "grabbing" : "grab" }}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={endDrag}
        onPointerLeave={endDrag}
      >
        <div style={{
          position: "absolute", left: "50%", top: "50%", width: 1000,
          transform: `translate(-50%, -50%) translate(${pos.x}px, ${pos.y}px)`,
          transition: drag ? "none" : "transform 0.25s ease-out",
          filter: "drop-shadow(0 20px 50px rgba(0,0,0,0.6))",
        }}>
          <BoardPhoto teams={teams} activeTeamId={activeTeamId} boardLength={boardLength} pickableIdx={pickableIdx} onPick={onPick} tokenScale={1.4} />
        </div>
      </div>

      <div style={{ padding: "10px 16px 20px" }}>
        <TeamLegend teams={teams} activeTeamId={activeTeamId} boardLength={boardLength} />
      </div>
    </div>,
    document.body
  );
}

// How long the board's own token-move CSS transition takes (see BoardPhoto),
// so the "next turn" summary waits for the piece to finish sliding into place.
function PlayingScreen({
  activeTeam,
  turnLabel,
  isMyTurnPicking,
  pickableIdx,
  onPick,
  pickInstructions,
  isMyTurnRedRound,
  redWordIndex,
  redMax,
  redWord,
  redTeamChoices,
  onStopRedRound,
  isMyTurnPlaying,
  timeLeftLabel,
  timerColor,
  timerAnim,
  flipDeg,
  cardWords,
  activeNumber,
  correctCount,
  skipCount,
  onSkip,
  onCorrect,
  isMyTurnResult,
  advanceCount,
  onNextTurn,
  isSpectating,
  isSpectatingCardPhase,
  spectatorStatus,
  showSpectatorTimer,
  teams,
  boardLength,
}) {
  const [showMap, setShowMap] = useState(false);
  const [resultRevealed, setResultRevealed] = useState(false);

  // Let players watch their piece actually slide into its new spot on the
  // board before the "advance to next turn" summary appears.
  useEffect(() => {
    if (!isMyTurnResult) {
      setResultRevealed(false);
      return;
    }
    const t = setTimeout(() => setResultRevealed(true), 700);
    return () => clearTimeout(t);
  }, [isMyTurnResult]);

  // While a turn is actively being played (the card + timer) or the shared
  // red round is running, the board goes away entirely and gives the whole
  // screen to that moment; picking a number and seeing the result both
  // happen on the board screen instead.
  const isCardMode = isMyTurnPlaying || isMyTurnRedRound || isSpectatingCardPhase;
  const showTimer = isMyTurnPlaying || (isSpectating && showSpectatorTimer);

  return (
    <div style={{ width: "100%", maxWidth: 460, display: "flex", flexDirection: "column", gap: 16, marginTop: "2vh" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: activeTeam.color, borderRadius: "var(--radius-lg)", padding: "14px 20px" }}>
        <div style={{ fontSize: 19, fontWeight: 600, color: "white" }}>{activeTeam.name}</div>
        <div style={{ fontSize: 14, color: "white", opacity: 0.9 }}>תור {turnLabel}</div>
      </div>

      {!isCardMode && (
        <div key="board-page" style={{ display: "flex", flexDirection: "column", gap: 16, animation: "atias-page-in 0.4s cubic-bezier(0.2, 0.8, 0.3, 1)" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end" }}>
            <button
              onClick={() => setShowMap(true)}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 8,
                padding: "8px 16px",
                border: "1px solid var(--color-divider)",
                borderRadius: 999,
                background: "var(--color-surface)",
                color: "var(--color-text)",
                fontSize: 14,
                fontWeight: 500,
                fontFamily: "var(--font-heading)",
                cursor: "pointer",
              }}
            >
              <span style={{ fontSize: 18 }}>🗺️</span>
              מסך מלא
            </button>
          </div>

          {showMap && (
            <BoardModal
              teams={teams}
              activeTeamId={activeTeam.id}
              boardLength={boardLength}
              pickableIdx={pickableIdx}
              onPick={onPick}
              onClose={() => setShowMap(false)}
            />
          )}

          <BoardPhoto teams={teams} activeTeamId={activeTeam.id} boardLength={boardLength} pickableIdx={pickableIdx} onPick={onPick} />
          <TeamLegend teams={teams} activeTeamId={activeTeam.id} boardLength={boardLength} />

          {isMyTurnPicking && (
            <div style={{ background: "var(--color-surface)", borderRadius: "var(--radius-lg)", padding: 18, textAlign: "center", boxShadow: "var(--shadow-sm)" }}>
              <div style={{ fontSize: 14, fontWeight: 500 }}>{pickInstructions}</div>
            </div>
          )}

          {isMyTurnResult && !resultRevealed && (
            <div style={{ textAlign: "center", padding: 14 }}>
              <div style={{ fontSize: 14, color: "color-mix(in srgb, var(--color-text) 60%, transparent)" }}>מתקדמים בלוח...</div>
            </div>
          )}

          {isMyTurnResult && resultRevealed && (
            <div style={{ background: "var(--color-surface)", borderRadius: "var(--radius-lg)", padding: 28, textAlign: "center", boxShadow: "var(--shadow-sm)", display: "flex", flexDirection: "column", gap: 14, animation: "atias-pop 0.3s ease" }}>
              <div style={{ fontSize: 16, color: "color-mix(in srgb, var(--color-text) 55%, transparent)" }}>הזמן נגמר!</div>
              <div style={{ fontSize: 60, fontWeight: 700, color: "var(--color-accent)", fontFamily: "var(--font-heading)" }}>{advanceCount}</div>
              <div style={{ fontSize: 15, color: "color-mix(in srgb, var(--color-text) 65%, transparent)" }}>משבצות להתקדם על הלוח</div>
              <div style={{ fontSize: 13, color: "color-mix(in srgb, var(--color-text) 55%, transparent)" }}>✓ {correctCount} נכונות · ⏭ {skipCount} דילוגים</div>
              <button onClick={onNextTurn} style={{ width: "100%", padding: 18, border: "1px solid var(--color-accent)", borderRadius: "var(--radius-lg)", background: "transparent", color: "var(--color-accent)", fontSize: 17, fontWeight: 500, fontFamily: "var(--font-heading)", cursor: "pointer", marginTop: 8 }}>
                לתור הבא ←
              </button>
            </div>
          )}

          {isSpectating && !isSpectatingCardPhase && (
            <div style={{ background: "var(--color-surface)", borderRadius: "var(--radius-lg)", padding: 32, textAlign: "center", boxShadow: "var(--shadow-sm)", display: "flex", flexDirection: "column", gap: 12 }}>
              <div style={{ fontSize: 42 }}>👀</div>
              <div style={{ fontSize: 17, fontWeight: 500 }}>התור של {activeTeam.name}</div>
              <div style={{ fontSize: 14, color: "color-mix(in srgb, var(--color-text) 55%, transparent)" }}>{spectatorStatus}</div>
            </div>
          )}
        </div>
      )}

      {isCardMode && (
        <div key="card-page" style={{ display: "flex", flexDirection: "column", gap: 16, animation: "atias-page-in 0.4s cubic-bezier(0.2, 0.8, 0.3, 1)" }}>
          {showTimer ? (
            <div style={{ alignSelf: "center", display: "flex", alignItems: "center", gap: 8, padding: "8px 22px", border: "1px solid var(--color-divider)", borderRadius: 999, background: "var(--color-surface)" }}>
              <span style={{ fontSize: 18 }}>⏳</span>
              <span style={{ fontSize: 22, fontWeight: 800, color: timerColor, animation: timerAnim, fontFamily: "var(--font-heading)" }}>{timeLeftLabel}</span>
            </div>
          ) : null}

          {isMyTurnRedRound && (
            <div style={{ background: "linear-gradient(160deg, #2a1414, #1a0d0d)", border: "1px solid #b8322f", borderRadius: "var(--radius-lg)", padding: 26, textAlign: "center", boxShadow: "var(--shadow-sm)", display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={{ fontSize: 13, color: "#e0a3a0", letterSpacing: "0.06em" }}>🔴 עיגול אדום — מילה {redWordIndex} מתוך {redMax}</div>
              <div style={{ fontSize: 32, fontWeight: 800, color: "white", fontFamily: "'Frank Ruhl Libre', serif" }}>{redWord}</div>
              <div style={{ fontSize: 13, color: "#e0a3a0" }}>מי ענה ראשון נכון? תנו להם את הנקודה:</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {redTeamChoices.map((rt) => (
                  <button
                    key={rt.id}
                    onClick={rt.award}
                    style={{ width: "100%", padding: 14, border: "none", borderRadius: 12, background: rt.color, color: "white", fontSize: 15, fontWeight: 600, fontFamily: "var(--font-heading)", cursor: "pointer" }}
                  >
                    נקודה ל{rt.name}
                  </button>
                ))}
              </div>
              <button
                onClick={onStopRedRound}
                style={{ width: "100%", padding: 14, border: "1px solid var(--color-divider)", borderRadius: 12, background: "transparent", color: "var(--color-text)", fontSize: 14, fontWeight: 500, fontFamily: "var(--font-heading)", cursor: "pointer" }}
              >
                סיימתי
              </button>
            </div>
          )}

          {isMyTurnPlaying && (
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={{ perspective: 1400 }}>
                <div style={{ position: "relative", transformStyle: "preserve-3d", transform: `rotateY(${flipDeg}deg)`, transition: "transform 0.8s cubic-bezier(0.4, 0.1, 0.2, 1)", minHeight: 380 }}>
                  {/* front face — the word card, same ornate ATIAS styling as the back */}
                  <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden", background: "linear-gradient(135deg, #cfa049, #8a6a2f, #cfa049)", borderRadius: 22, padding: 5, boxShadow: "0 12px 30px rgba(0,0,0,0.45)" }}>
                    <div
                      style={{
                        position: "relative",
                        background:
                          "radial-gradient(circle at 20% 15%, rgba(201,162,39,0.16), transparent 40%), radial-gradient(circle at 80% 85%, rgba(47,122,99,0.18), transparent 40%), linear-gradient(160deg, #5a1418, #2a0d10)",
                        borderRadius: 18,
                        border: "1.5px solid #c9a227",
                        height: "100%",
                        overflow: "hidden",
                        display: "flex",
                        flexDirection: "column",
                        gap: 12,
                        padding: "20px 18px 16px",
                      }}
                    >
                      <div style={{ position: "absolute", inset: 9, border: "2px solid #2f7a63", borderRadius: "56px 56px 22px 22px", pointerEvents: "none" }} />
                      <div style={{ position: "absolute", inset: 16, border: "1px solid #c9a227", borderRadius: "48px 48px 18px 18px", pointerEvents: "none" }} />
                      <div style={{ position: "absolute", top: 20, left: 20, fontSize: 12, color: "#c9a227" }}>✦</div>
                      <div style={{ position: "absolute", top: 20, right: 20, fontSize: 12, color: "#c9a227" }}>✦</div>
                      <div style={{ position: "absolute", bottom: 20, left: 20, fontSize: 12, color: "#c9a227" }}>✦</div>
                      <div style={{ position: "absolute", bottom: 20, right: 20, fontSize: 12, color: "#c9a227" }}>✦</div>

                      <div style={{ position: "relative", alignSelf: "center", background: "#f6ecd6", border: "2px solid #c9a227", borderRadius: 40, padding: "8px 26px", marginBottom: 2 }}>
                        <div style={{ fontSize: 24, fontWeight: 700, color: "#2a1a0a", fontFamily: "'Frank Ruhl Libre', serif", textAlign: "center" }}>אטיאס!</div>
                      </div>

                      <div style={{ position: "relative", display: "flex", flexDirection: "column", gap: 9, padding: "0 4px" }}>
                        {cardWords.map((w, i) => (
                          <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: w.padding, borderRadius: 10, background: w.bg }}>
                            <div style={{ fontSize: w.starSize, color: w.starColor, flexShrink: 0 }}>★</div>
                            <div style={{ fontSize: w.size, fontWeight: w.weight, color: w.color, fontFamily: "'Frank Ruhl Libre', serif" }}>{w.text}</div>
                          </div>
                        ))}
                      </div>

                      <div style={{ position: "relative", marginTop: "auto", textAlign: "center", fontSize: 11, color: "#e0c789", letterSpacing: "0.08em" }}>
                        מספר {activeNumber} • ✓ {correctCount} · ⏭ {skipCount}
                      </div>
                    </div>
                  </div>

                  {/* back face — the card back */}
                  <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden", transform: "rotateY(180deg)", background: "linear-gradient(135deg, #cfa049, #8a6a2f, #cfa049)", borderRadius: 22, padding: 5, boxShadow: "0 12px 30px rgba(0,0,0,0.45)" }}>
                    <div
                      style={{
                        position: "relative",
                        background:
                          "radial-gradient(circle at 20% 15%, rgba(201,162,39,0.16), transparent 40%), radial-gradient(circle at 80% 85%, rgba(47,122,99,0.18), transparent 40%), linear-gradient(160deg, #5a1418, #2a0d10)",
                        borderRadius: 18,
                        border: "1.5px solid #c9a227",
                        height: "100%",
                        overflow: "hidden",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                      }}
                    >
                      <div style={{ position: "absolute", inset: 9, border: "2px solid #2f7a63", borderRadius: "56px 56px 22px 22px" }} />
                      <div style={{ position: "absolute", inset: 16, border: "1px solid #c9a227", borderRadius: "48px 48px 18px 18px" }} />
                      <div style={{ position: "absolute", top: 20, left: 20, fontSize: 12, color: "#c9a227" }}>✦</div>
                      <div style={{ position: "absolute", top: 20, right: 20, fontSize: 12, color: "#c9a227" }}>✦</div>
                      <div style={{ position: "absolute", bottom: 20, left: 20, fontSize: 12, color: "#c9a227" }}>✦</div>
                      <div style={{ position: "absolute", bottom: 20, right: 20, fontSize: 12, color: "#c9a227" }}>✦</div>

                      <div style={{ position: "relative", display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
                        <div style={{ fontSize: 34 }}>🫖</div>
                        <div style={{ background: "#f6ecd6", border: "2px solid #c9a227", borderRadius: 40, padding: "10px 26px" }}>
                          <div style={{ fontSize: 24, fontWeight: 700, color: "#2a1a0a", fontFamily: "'Frank Ruhl Libre', serif", textAlign: "center" }}>אטיאס!</div>
                        </div>
                        <div style={{ fontSize: 10, letterSpacing: "0.14em", color: "#e0c789" }}>מסע המילים</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={onSkip} style={{ flex: 1, padding: 20, border: "1px solid var(--color-divider)", background: "var(--color-surface)", borderRadius: "var(--radius-lg)", fontSize: 17, fontWeight: 500, fontFamily: "var(--font-heading)", cursor: "pointer", color: "var(--color-text)" }}>
                  ⏭ דילוג
                </button>
                <button onClick={onCorrect} style={{ flex: 2, padding: 20, border: "none", background: "oklch(0.55 0.15 145)", color: "white", borderRadius: "var(--radius-lg)", fontSize: 19, fontWeight: 700, fontFamily: "var(--font-heading)", cursor: "pointer" }}>
                  ✓ נכון!
                </button>
              </div>
            </div>
          )}

          {isSpectatingCardPhase && (
            <div style={{ background: "var(--color-surface)", borderRadius: "var(--radius-lg)", padding: 32, textAlign: "center", boxShadow: "var(--shadow-sm)", display: "flex", flexDirection: "column", gap: 12 }}>
              <div style={{ fontSize: 42 }}>👀</div>
              <div style={{ fontSize: 17, fontWeight: 500 }}>התור של {activeTeam.name}</div>
              <div style={{ fontSize: 14, color: "color-mix(in srgb, var(--color-text) 55%, transparent)" }}>{spectatorStatus}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function GameOverScreen({ winnerTeam, onHome }) {
  return (
    <div style={{ width: "100%", maxWidth: 420, display: "flex", flexDirection: "column", alignItems: "center", gap: 20, marginTop: "14vh", textAlign: "center", animation: "atias-pop 0.4s ease" }}>
      <div style={{ fontSize: 46 }}>🏆</div>
      <div style={{ fontSize: 16, color: "color-mix(in srgb, var(--color-text) 60%, transparent)" }}>מנצחים!</div>
      <div style={{ fontSize: 34, fontWeight: 700, color: winnerTeam && winnerTeam.color, fontFamily: "'Frank Ruhl Libre', serif" }}>{winnerTeam && winnerTeam.name}</div>
      <button onClick={onHome} style={{ width: "100%", padding: 18, border: "1px solid var(--color-accent)", borderRadius: "var(--radius-lg)", background: "transparent", color: "var(--color-accent)", fontSize: 17, fontWeight: 500, fontFamily: "var(--font-heading)", cursor: "pointer" }}>חזרה לדף הבית</button>
    </div>
  );
}

function App() {
  const { state, actions } = useAtiasGame();
  const view = deriveView(state, actions);

  return (
    <div dir="rtl" style={{ minHeight: "100vh", width: "100%", background: "var(--color-bg)", display: "flex", flexDirection: "column", alignItems: "center", fontFamily: "var(--font-body)", color: "var(--color-text)", padding: "20px 16px 40px" }}>
      {view.isHome && <HomeScreen onCreate={actions.goCreate} onJoin={actions.goJoin} />}
      {view.isJoin && (
        <JoinScreen joinCodeInput={state.joinCodeInput} onCodeChange={actions.setJoinCode} onSearch={actions.findRoom} joinError={state.joinError} joinErrorText={view.joinErrorText} onBack={actions.goHome} />
      )}
      {view.isSetup && (
        <SetupScreen setupName={view.setupName} onNameChange={actions.setSetupName} onConfirm={actions.confirmSetup} confirmDisabled={view.confirmDisabled} onBack={actions.goHome} />
      )}
      {view.isLobbyWaiting && (
        <LobbyScreen roomCode={view.roomCode} lobbyStatusText={view.lobbyStatusText} teams={view.teams} isHost={view.isHost} showHostNameInput={view.showHostNameInput} setupName={view.setupName} onNameChange={actions.setSetupName} onConfirmName={actions.confirmSetup} confirmDisabled={view.confirmDisabled} durationChoices={view.durationChoices} onStart={actions.hostStartGame} startDisabled={view.startDisabled} startOpacity={view.startOpacity} onBack={actions.goHome} />
      )}
      {view.isPlayingScreen && (
        <PlayingScreen activeTeam={view.activeTeam} turnLabel={view.turnLabel} isMyTurnPicking={view.isMyTurnPicking} pickableIdx={view.pickableIdx} onPick={view.onPick} pickInstructions={view.pickInstructions} isMyTurnRedRound={view.isMyTurnRedRound} redWordIndex={view.redWordIndex} redMax={view.redMax} redWord={view.redWord} redTeamChoices={view.redTeamChoices} onStopRedRound={actions.stopRedRound} isMyTurnPlaying={view.isMyTurnPlaying} timeLeftLabel={view.timeLeftLabel} timerColor={view.timerColor} timerAnim={view.timerAnim} flipDeg={view.flipDeg} cardWords={view.cardWords} activeNumber={view.activeNumber} correctCount={view.correctCount} skipCount={view.skipCount} onSkip={actions.markSkip} onCorrect={actions.markCorrect} isMyTurnResult={view.isMyTurnResult} advanceCount={view.advanceCount} onNextTurn={actions.nextTurn} isSpectating={view.isSpectating} isSpectatingCardPhase={view.isSpectatingCardPhase} spectatorStatus={view.spectatorStatus} showSpectatorTimer={view.showSpectatorTimer} teams={view.teams} boardLength={view.boardLength} />
      )}
      {view.isGameOver && <GameOverScreen winnerTeam={view.winnerTeam} onHome={actions.goHome} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
